<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cdd6f4"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes breathe {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .title {
        font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, monospace;
        font-size: 72px;
        font-weight: 700;
        fill: url(#titleGrad);
        filter: url(#softGlow);
        animation: breathe 4s ease-in-out infinite;
      }
      .tagline {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #a6adc8;
        letter-spacing: 3px;
      }
      .accent {
        stroke: #74c7ec;
        stroke-width: 1;
        opacity: 0.4;
      }
      .shimmer-line {
        stroke: #89b4fa;
        stroke-width: 1;
        opacity: 0.6;
        animation: shimmer 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1e1e2e"/>

  <!-- Subtle top & bottom borders -->
  <line class="accent" x1="60" y1="40" x2="840" y2="40"/>
  <line class="accent" x1="60" y1="180" x2="840" y2="180"/>

  <!-- Main title -->
  <text class="title" x="50%" y="115" text-anchor="middle" dominant-baseline="middle">zhugez</text>

  <!-- Tagline -->
  <text class="tagline" x="50%" y="155" text-anchor="middle">OFFENSIVE SECURITY  ·  RED TEAM  ·  RESEARCH</text>

  <!-- Soft shimmer accent under title -->
  <line class="shimmer-line" x1="250" y1="135" x2="650" y2="135"/>
</svg>
